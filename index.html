<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Task Manager</title>
    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
    <main class="app">
        <header class="app-header">
            <h1>Task Manager</h1>
            <p>Add, complete, and manage your tasks.</p>
        </header>
        <form id="taskForm">
            <label for="taskInput">Task Title</label>
            <div class="form-row">
                <input id="taskInput" type="text" placeholder="Enter a task" required>
                <button type="submit">Add Task</button>
            </div>
        </form>
        <p id="message" aria-live="polite"></p>
        
        <section class="task-section">
            <h2>My Tasks</h2>
            
            <div class="task-controls">
 
                <label for="taskFilter">Filter:</label>
                <select id="taskFilter">
                    <option value="all">All</option>
                    <option value="active">Active</option>
                    <option value="completed">Completed</option>
                </select>    
                <button id="clearCompletedBtn" type="button">Clear Completed</button>
            </div>

            <p id="taskSummary"></p>
            
            <ul id="taskList"></ul>
        </section>
    </main>
    <script src="./js/app.js"></script>
</body>

</html>
